<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Островок</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #ffffff;
	/* Цвет воды вокруг острова (WATER_COLOR затемнён на 0.3): загрузка плавно переходит в игру без вспышек. */
	background-color: #1d5081;
	overflow: hidden;
	touch-action: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #1d5081;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#status-text {
	font-size: 1.6rem;
	letter-spacing: 0.04em;
}

#status-progress {
	width: min(60%, 360px);
	height: 0.6rem;
	margin-top: 1.2rem;
	border: 0;
	border-radius: 0.3rem;
	overflow: hidden;
	background-color: rgba(255, 255, 255, 0.25);
	accent-color: #ffffff;
	-webkit-appearance: none;
	appearance: none;
}

#status-progress::-webkit-progress-bar {
	background-color: rgba(255, 255, 255, 0.25);
}

#status-progress::-webkit-progress-value {
	background-color: #ffffff;
}

#status-progress::-moz-progress-bar {
	background-color: #ffffff;
}

#status-notice {
	display: none;
	max-width: 32rem;
	margin: 0 2rem;
	padding: 1rem;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	background-color: #5b3943;
	color: #e0e0e0;
	line-height: 1.3;
	text-align: center;
	-webkit-user-select: text;
	user-select: text;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="0">
			Браузер не поддерживает canvas.
		</canvas>

		<noscript>
			Для запуска игры нужен включённый JavaScript.
		</noscript>

		<div id="status">
			<div id="status-text">Загрузка…</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13648568,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Фокус холста: с самого старта и при каждом нажатии (в фазе перехвата, до обработчиков игры).
// Событие не гасится, поэтому первый же клик и фокусирует холст, и доходит до игры.
(function () {
	const canvas = document.getElementById('canvas');

	function focusCanvas() {
		try {
			window.focus();
			canvas.focus({ preventScroll: true });
		} catch (err) {
			// Фокус не критичен для работы игры.
		}
	}

	focusCanvas();
	window.addEventListener('pointerdown', focusCanvas, true);
	window.addEventListener('touchstart', focusCanvas, { capture: true, passive: true });
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = 'Неизвестная ошибка.';
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		}
		setStatusNotice('Не удалось запустить игру.\n' + message);
		setStatusMode('notice');
		initializing = false;
	}

	// Движок называет недостающие возможности по-английски: подменяем понятными формулировками.
	function missingFeatureText(feature) {
		if (feature.indexOf('WebGL') === 0) {
			return 'WebGL 2: включите аппаратное ускорение в настройках браузера или обновите его.';
		}
		if (feature.indexOf('Secure Context') === 0) {
			return 'Игру нужно открывать по защищённому адресу (https).';
		}
		return feature;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// Установка сервис-воркера может устранить нехватку возможностей (только для сборки с потоками).
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// getRegistration() иногда зависает.
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('Браузер не поддерживает нужные возможности:\n' + missing.map(missingFeatureText).join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusText.textContent = 'Загрузка… ' + Math.min(100, Math.floor(current * 100 / total)) + ' %';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusText.textContent = 'Загрузка…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
